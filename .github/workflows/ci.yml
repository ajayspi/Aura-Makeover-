name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The Next.js app lives in auro-makeover/ beneath the repo root.
defaults:
  run:
    working-directory: auro-makeover

jobs:
  ci:
    name: Acceptance gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: auro-makeover/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gates run in order; a failure stops the job (fail fast on first gate).
      - name: Gate 1 — E2E suite
        run: node scripts/test-e2e.mjs

      - name: Gate 2 — Typecheck
        run: npx tsc --noEmit

      - name: Gate 3 — Lint
        run: npm run lint

      - name: Gate 4 — Build
        run: npm run build