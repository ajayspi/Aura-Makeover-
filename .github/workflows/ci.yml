name: CI

on:
  push:
    branches: [main, init-auromakeover-16081128185176046364]
  pull_request:
    branches: [main, init-auromakeover-16081128185176046364]

# The Next.js app lives at the repo root (flattened 2026-09-23).
jobs:
  ci:
    name: Acceptance gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gates run in order; a failure stops the job (fail fast on first gate).
      - name: Gate 1 — E2E suite
        run: node scripts/test-e2e.mjs

      - name: Gate 2 — Typecheck
        run: npx tsc --noEmit

      - name: Gate 3 — Lint
        run: npm run lint

      - name: Gate 4 — Build
        run: npm run build